    <!-- Quill CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              imesc: {
                50: '#f2f7fb',
                100: '#e1ecf6',
                200: '#c5dbeec',
                300: '#9cbfe0',
                400: '#6f9ecf',
                500: '#4e81bc',

          }
        }

    <style>
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8; 
      }
      /* Quill Overrides */
      .ql-toolbar {
        border-top-left-radius: 0.5rem;
        border-top-right-radius: 0.5rem;
        border-color: #cbd5e1 !important;
        background-color: #f8fafc;
      }
      .ql-container {
        border-bottom-left-radius: 0.5rem;
        border-bottom-right-radius: 0.5rem;
        border-color: #cbd5e1 !important;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        font-size: 0.875rem !important; /* text-sm */
        height: auto !important; /* Permite que o container cresça */
      }
      .ql-editor {
        min-height: 60px; /* Reduzido de 150px para iniciar menor */
        height: auto !important; /* Permite crescimento conforme digitação */
        overflow-y: hidden; /* Oculta barra de rolagem vertical enquanto cresce */
      }
    </style>
